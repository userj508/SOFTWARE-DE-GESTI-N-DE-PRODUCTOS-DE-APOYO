<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Gestión de Apoyos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navigation -->
    <nav class="bg-blue-600 p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Gestión de Apoyos</h1>
            <div>
                <a href="dashboard.html" class="mr-4 hover:underline">Inicio</a>
                <a href="products.html" class="mr-4 font-bold underline">Productos</a>
                <a href="incidents.html" class="mr-4 hover:underline">Incidencias</a>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-700 px-3 py-1 rounded">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-8 p-4 bg-white rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Catálogo de Productos</h2>
            <button id="openModalBtn" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                + Nuevo Producto
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Código</th>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Tipo</th>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Marca/Modelo</th>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Estado</th>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Entidad</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody" class="divide-y divide-gray-200">
                    <!-- Data populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal for New Product -->
    <div id="productModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Añadir Producto</h3>
            <form id="productForm">
                <div id="entitySelectContainer" class="mb-4 hidden">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Entidad Asignada</label>
                    <select id="entityId" class="border rounded w-full py-2 px-3"></select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Tipo de Producto</label>
                    <select id="productType" class="border rounded w-full py-2 px-3" required></select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Código Interno</label>
                    <input id="internalCode" type="text" class="border rounded w-full py-2 px-3" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Número de Serie</label>
                    <input id="serialNumber" type="text" class="border rounded w-full py-2 px-3">
                </div>
                <div class="mb-4 flex space-x-4">
                    <div class="w-1/2">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Marca</label>
                        <input id="brand" type="text" class="border rounded w-full py-2 px-3">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Modelo</label>
                        <input id="model" type="text" class="border rounded w-full py-2 px-3">
                    </div>
                </div>

                <hr class="my-4">
                <h4 class="text-lg font-semibold mb-2">Atributos Específicos</h4>
                <div id="dynamicAttributesContainer" class="mb-4 space-y-3">
                    <p class="text-gray-500 text-sm">Selecciona un tipo de producto para ver sus atributos.</p>
                </div>

                <div class="flex justify-end space-x-2">
                    <button type="button" id="closeModalBtn" class="bg-gray-400 hover:bg-gray-600 text-white py-2 px-4 rounded">Cancelar</button>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white py-2 px-4 rounded">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let currentDynamicAttributes = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = await checkAuthAndReturnUser();
            if (user && user.role === 'superadmin') {
                document.getElementById('entitySelectContainer').classList.remove('hidden');
                loadEntities();
            }

            loadProducts();
            loadProductTypes();

            document.getElementById('openModalBtn').addEventListener('click', () => {
                document.getElementById('productModal').classList.remove('hidden');
            });

            document.getElementById('productType').addEventListener('change', async (e) => {
                const typeId = e.target.value;
                if (!typeId) {
                    document.getElementById('dynamicAttributesContainer').innerHTML = '<p class="text-gray-500 text-sm">Selecciona un tipo de producto para ver sus atributos.</p>';
                    return;
                }

                const res = await fetch(`/api/dynamic_attributes.php?product_type_id=${typeId}`);
                if (res.ok) {
                    currentDynamicAttributes = await res.json();
                    renderDynamicAttributes(currentDynamicAttributes);
                }
            });
            document.getElementById('closeModalBtn').addEventListener('click', () => {
                document.getElementById('productModal').classList.add('hidden');
            });

            document.getElementById('productForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const attributes = {};
                currentDynamicAttributes.forEach(attr => {
                    const el = document.getElementById(`attr_${attr.id}`);
                    if (el) {
                        attributes[attr.id] = el.type === 'checkbox' ? (el.checked ? 'Sí' : 'No') : el.value;
                    }
                });

                const data = {
                    product_type_id: document.getElementById('productType').value,
                    internal_code: document.getElementById('internalCode').value,
                    serial_number: document.getElementById('serialNumber').value,
                    brand: document.getElementById('brand').value,
                    model: document.getElementById('model').value,
                    attributes: attributes
                };

                const entityIdVal = document.getElementById('entityId').value;
                if (entityIdVal) {
                    data.entity_id = entityIdVal;
                }

                const res = await fetch('/api/products.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    document.getElementById('productModal').classList.add('hidden');
                    document.getElementById('productForm').reset();
                    loadProducts();
                } else {
                    alert("Error guardando el producto");
                }
            });
        });

        async function loadProducts() {
            const res = await fetch('/api/products.php');
            if (!res.ok) return;
            const products = await res.json();
            const tbody = document.getElementById('productsTableBody');
            tbody.innerHTML = '';

            products.forEach(p => {
                let attrHtml = '';
                if (p.attributes && p.attributes.length > 0) {
                    attrHtml = '<div class="text-xs text-gray-500 mt-1">';
                    p.attributes.forEach(a => {
                        attrHtml += `<span class="mr-2 border rounded px-1 bg-gray-50">${a.name}: ${a.value}</span>`;
                    });
                    attrHtml += '</div>';
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-2 px-4 border-b">
                        ${p.internal_code}
                        ${attrHtml}
                    </td>
                    <td class="py-2 px-4 border-b">${p.type_name || 'N/A'}</td>
                    <td class="py-2 px-4 border-b">${p.brand || ''} ${p.model || ''}</td>
                    <td class="py-2 px-4 border-b"><span class="px-2 py-1 bg-green-100 text-green-800 rounded text-xs">${p.status}</span></td>
                    <td class="py-2 px-4 border-b text-sm text-gray-500">${p.entity_name || 'Global'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function loadProductTypes() {
            const res = await fetch('/api/product_types.php');
            if (!res.ok) return;
            const types = await res.json();
            const select = document.getElementById('productType');
            select.innerHTML = '<option value="">-- Selecciona --</option>';
            types.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.innerText = t.name;
                select.appendChild(opt);
            });
        }

        async function loadEntities() {
            const res = await fetch('/api/entities.php');
            if (!res.ok) return;
            const entities = await res.json();
            const select = document.getElementById('entityId');
            select.innerHTML = '<option value="">-- Selecciona --</option>';
            entities.forEach(e => {
                const opt = document.createElement('option');
                opt.value = e.id;
                opt.innerText = e.name;
                select.appendChild(opt);
            });
        }

        function renderDynamicAttributes(attributes) {
            const container = document.getElementById('dynamicAttributesContainer');
            container.innerHTML = '';

            if (attributes.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">Este tipo no tiene atributos específicos configurados.</p>';
                return;
            }

            attributes.forEach(attr => {
                const div = document.createElement('div');
                let inputHtml = '';

                if (attr.type === 'boolean') {
                    inputHtml = `<input type="checkbox" id="attr_${attr.id}" class="mr-2 leading-tight">`;
                } else if (attr.type === 'number') {
                    inputHtml = `<input type="number" id="attr_${attr.id}" class="border rounded w-full py-2 px-3">`;
                } else {
                    inputHtml = `<input type="text" id="attr_${attr.id}" class="border rounded w-full py-2 px-3">`;
                }

                div.innerHTML = `
                    <label class="block text-gray-700 text-sm font-bold mb-1">${attr.name}</label>
                    ${inputHtml}
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
