<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidencias - Gestión de Apoyos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navigation -->
    <nav class="bg-blue-600 p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Gestión de Apoyos</h1>
            <div>
                <a href="dashboard.html" class="mr-4 hover:underline">Inicio</a>
                <a href="products.html" class="mr-4 hover:underline">Productos</a>
                <a href="incidents.html" class="mr-4 font-bold underline">Incidencias</a>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-700 px-3 py-1 rounded">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-8 p-4 bg-white rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Registro de Incidencias</h2>
            <button id="openIncidentModalBtn" class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded">
                Reportar Incidencia
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Fecha</th>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Producto (Cód)</th>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Título</th>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Estado</th>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Reportado por</th>
                    </tr>
                </thead>
                <tbody id="incidentsTableBody" class="divide-y divide-gray-200">
                    <!-- Data populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal for New Incident -->
    <div id="incidentModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Reportar Incidencia</h3>
            <form id="incidentForm">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Producto</label>
                    <select id="incidentProductId" class="border rounded w-full py-2 px-3" required></select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Título del problema</label>
                    <input id="incidentTitle" type="text" class="border rounded w-full py-2 px-3" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Descripción detallada</label>
                    <textarea id="incidentDescription" rows="4" class="border rounded w-full py-2 px-3" required></textarea>
                </div>

                <div class="flex justify-end space-x-2">
                    <button type="button" id="closeIncidentModalBtn" class="bg-gray-400 hover:bg-gray-600 text-white py-2 px-4 rounded">Cancelar</button>
                    <button type="submit" class="bg-orange-500 hover:bg-orange-700 text-white py-2 px-4 rounded">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            loadIncidents();
            loadProductsForSelect();

            document.getElementById('openIncidentModalBtn').addEventListener('click', () => {
                document.getElementById('incidentModal').classList.remove('hidden');
            });
            document.getElementById('closeIncidentModalBtn').addEventListener('click', () => {
                document.getElementById('incidentModal').classList.add('hidden');
            });

            document.getElementById('incidentForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const data = {
                    product_id: document.getElementById('incidentProductId').value,
                    title: document.getElementById('incidentTitle').value,
                    description: document.getElementById('incidentDescription').value
                };

                const res = await fetch('/api/incidents.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    document.getElementById('incidentModal').classList.add('hidden');
                    document.getElementById('incidentForm').reset();
                    loadIncidents();
                } else {
                    alert("Error guardando la incidencia");
                }
            });
        });

        async function loadIncidents() {
            const res = await fetch('/api/incidents.php');
            if (!res.ok) return;
            const incidents = await res.json();
            const tbody = document.getElementById('incidentsTableBody');
            tbody.innerHTML = '';

            incidents.forEach(i => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-2 px-4 border-b">${new Date(i.created_at).toLocaleDateString()}</td>
                    <td class="py-2 px-4 border-b">${i.internal_code}</td>
                    <td class="py-2 px-4 border-b font-semibold">${i.title}</td>
                    <td class="py-2 px-4 border-b"><span class="px-2 py-1 bg-red-100 text-red-800 rounded text-xs uppercase">${i.status}</span></td>
                    <td class="py-2 px-4 border-b text-sm text-gray-500">${i.reported_by_name}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function loadProductsForSelect() {
            const res = await fetch('/api/products.php');
            if (!res.ok) return;
            const products = await res.json();
            const select = document.getElementById('incidentProductId');
            products.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = `${p.internal_code} - ${p.brand || ''} ${p.model || ''}`;
                select.appendChild(opt);
            });
        }
    </script>
</body>
</html>
