<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestión de Apoyos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navigation -->
    <nav class="bg-blue-600 p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Gestión de Apoyos</h1>
            <div>
                <span id="userNameDisplay" class="mr-4 font-semibold"></span>
                <a href="dashboard.html" class="mr-4 hover:underline">Inicio</a>
                <a href="products.html" class="mr-4 hover:underline">Productos</a>
                <a href="incidents.html" class="mr-4 hover:underline">Incidencias</a>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-700 px-3 py-1 rounded">Salir</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto mt-8 p-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Products Card -->
            <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-500">
                <h2 class="text-xl font-bold mb-2">Productos</h2>
                <p class="text-gray-600 mb-4">Gestiona el inventario, características y estados.</p>
                <a href="products.html" class="text-blue-500 hover:underline">Ver productos &rarr;</a>
            </div>

            <!-- Incidents Card -->
            <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-orange-500">
                <h2 class="text-xl font-bold mb-2">Incidencias</h2>
                <p class="text-gray-600 mb-4">Controla reparaciones y problemas reportados.</p>
                <a href="incidents.html" class="text-orange-500 hover:underline">Ver incidencias &rarr;</a>
            </div>

            <!-- Assignments Card -->
            <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-green-500">
                <h2 class="text-xl font-bold mb-2">Asignaciones</h2>
                <p class="text-gray-600 mb-4">Historial de pacientes y ubicaciones.</p>
                <a href="assignments.html" class="text-green-500 hover:underline">Ver asignaciones &rarr;</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        checkAuth();
    </script>
</body>
</html>
