<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignaciones - Gestión de Apoyos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navigation -->
    <nav class="bg-blue-600 p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Gestión de Apoyos</h1>
            <div>
                <a href="dashboard.html" class="mr-4 hover:underline">Inicio</a>
                <a href="products.html" class="mr-4 hover:underline">Productos</a>
                <a href="incidents.html" class="mr-4 hover:underline">Incidencias</a>
                <a href="assignments.html" class="mr-4 font-bold underline">Asignaciones</a>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-700 px-3 py-1 rounded">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-8 p-4 bg-white rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Historial de Asignaciones</h2>
            <button id="openAssignModalBtn" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                + Nueva Asignación
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Fecha</th>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Producto</th>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Paciente</th>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Ubicación</th>
                        <th class="py-2 px-4 border-b text-left text-xs font-semibold text-gray-600 uppercase">Asignado por</th>
                    </tr>
                </thead>
                <tbody id="assignmentsTableBody" class="divide-y divide-gray-200">
                    <!-- Data populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal for New Assignment -->
    <div id="assignModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Mover o Asignar Producto</h3>
            <form id="assignForm">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Producto</label>
                    <select id="assignProductId" class="border rounded w-full py-2 px-3" required></select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Paciente (Opcional si vuelve a almacén)</label>
                    <select id="assignPatientId" class="border rounded w-full py-2 px-3">
                        <option value="">-- Ninguno (Almacén) --</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Ubicación (Ej. Domicilio, Almacén Central)</label>
                    <input id="assignLocation" type="text" class="border rounded w-full py-2 px-3" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Notas Adicionales</label>
                    <textarea id="assignNotes" rows="2" class="border rounded w-full py-2 px-3"></textarea>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" id="closeAssignModalBtn" class="bg-gray-400 hover:bg-gray-600 text-white py-2 px-4 rounded">Cancelar</button>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white py-2 px-4 rounded">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            loadAssignments();
            loadProductsForSelect();
            loadPatientsForSelect();

            document.getElementById('openAssignModalBtn').addEventListener('click', () => {
                document.getElementById('assignModal').classList.remove('hidden');
            });
            document.getElementById('closeAssignModalBtn').addEventListener('click', () => {
                document.getElementById('assignModal').classList.add('hidden');
            });

            document.getElementById('assignForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const data = {
                    product_id: document.getElementById('assignProductId').value,
                    patient_id: document.getElementById('assignPatientId').value || null,
                    location: document.getElementById('assignLocation').value,
                    notes: document.getElementById('assignNotes').value
                };

                const res = await fetch('/api/assignments.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    document.getElementById('assignModal').classList.add('hidden');
                    document.getElementById('assignForm').reset();
                    loadAssignments();
                } else {
                    alert("Error guardando la asignación");
                }
            });
        });

        async function loadAssignments() {
            const res = await fetch('/api/assignments.php');
            if (!res.ok) return;
            const assignments = await res.json();
            const tbody = document.getElementById('assignmentsTableBody');
            tbody.innerHTML = '';

            assignments.forEach(a => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-2 px-4 border-b">${new Date(a.assigned_at).toLocaleDateString()}</td>
                    <td class="py-2 px-4 border-b font-semibold">${a.product_code}</td>
                    <td class="py-2 px-4 border-b">${a.patient_name || '<span class="text-gray-400 italic">Sin paciente</span>'}</td>
                    <td class="py-2 px-4 border-b">${a.location}</td>
                    <td class="py-2 px-4 border-b text-sm text-gray-500">${a.assigned_by_name}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function loadProductsForSelect() {
            const res = await fetch('/api/products.php');
            if (!res.ok) return;
            const products = await res.json();
            const select = document.getElementById('assignProductId');
            select.innerHTML = '';
            products.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = `${p.internal_code} - ${p.brand || ''} ${p.model || ''}`;
                select.appendChild(opt);
            });
        }

        async function loadPatientsForSelect() {
            const res = await fetch('/api/patients.php');
            if (!res.ok) return;
            const patients = await res.json();
            const select = document.getElementById('assignPatientId');
            patients.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = p.name;
                select.appendChild(opt);
            });
        }
    </script>
</body>
</html>
